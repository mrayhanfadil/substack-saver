services:
  substack-saver:
    build: .
    container_name: substack-saver
    restart: always
    ports:
      - "127.0.0.1:8999:8999"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8999/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
